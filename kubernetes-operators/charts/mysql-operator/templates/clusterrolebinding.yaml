apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mysql-operator-binding  # <-- Имя должно быть указано
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: default
roleRef:
  kind: ClusterRole
  name: mysql-operator-role  # <-- Имя должно совпадать с ClusterRole
  apiGroup: rbac.authorization.k8s.io
